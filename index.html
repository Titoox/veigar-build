<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical Dashboard — Veigar & Syndra</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{--accent:#a855f7;--accent-dim:rgba(168,85,247,0.15);--accent-glow:rgba(168,85,247,0.4);--bg:#0a0a14;--card:#12121f;--card2:#16162a;--border:#1e1e35;--border2:#2a2a45;--gold:#fbbf24;--red:#ef4444;--orange:#f97316;--green:#22c55e;--cyan:#22d3ee;--text:#e2e2f0;--text-dim:#6b6b9a;--text-mid:#a0a0cc;}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Rajdhani",sans-serif;font-size:16px;min-height:100vh;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(168,85,247,.06) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 80% 90%,rgba(99,102,241,.05) 0%,transparent 60%);pointer-events:none;z-index:0}
#champion-selector{position:relative;z-index:10;display:flex;gap:16px;align-items:center;justify-content:center;padding:24px 20px 0}
.champ-btn{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--border2);border-radius:12px;padding:12px 24px;cursor:pointer;transition:all .25s;font-family:"Orbitron",sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-mid)}
.champ-btn img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.champ-btn:hover{border-color:var(--accent);color:var(--text)}
.champ-btn.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 20px var(--accent-glow),inset 0 0 20px var(--accent-dim)}
#tabs{position:relative;z-index:10;display:flex;gap:4px;padding:20px 20px 0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:8px 8px 0 0;padding:10px 18px;cursor:pointer;font-family:"Rajdhani",sans-serif;font-weight:600;font-size:14px;color:var(--text-dim);transition:all .2s;white-space:nowrap}
.tab-btn:hover{color:var(--text);border-color:var(--border2)}
.tab-btn.active{background:var(--card);border-color:var(--accent);border-bottom:1px solid var(--card);color:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
#content{position:relative;z-index:10;background:var(--card);border:1px solid var(--border);border-radius:0 12px 12px 12px;margin:0 20px 20px;padding:24px;min-height:500px}
.tab-panel{display:none}.tab-panel.active{display:block}
.card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:20px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--accent);box-shadow:0 0 16px var(--accent-dim)}
.card-title{font-family:"Orbitron",sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mt-16{margin-top:16px}.mt-12{margin-top:12px}
.item-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500}
.item-chip img{width:28px;height:28px;border-radius:4px;flex-shrink:0}
.item-chip-name{color:var(--text-mid);font-size:12px}
.rune-icon{position:relative;cursor:pointer;width:48px;height:48px;border-radius:50%;border:2px solid transparent;transition:all .2s}
.rune-icon.active{border-color:var(--accent);filter:brightness(1.1);box-shadow:0 0 12px var(--accent-glow)}
.rune-icon.inactive{opacity:.25;filter:grayscale(1)}
.rune-icon img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.rune-icon .tooltip{position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:#1a1a30;border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:100;min-width:160px;max-width:220px;text-align:center;white-space:normal}
.rune-icon:hover .tooltip{opacity:1}
.tooltip-name{font-weight:700;color:var(--accent);margin-bottom:4px;display:block}
.tooltip-desc{color:var(--text-mid);font-size:11px;line-height:1.4}
.flashcard{display:flex;align-items:flex-start;gap:12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px}
.flashcard-badge{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.badge-purple{background:rgba(168,85,247,.2);border:1px solid var(--accent);color:var(--accent)}
.badge-gold{background:rgba(251,191,36,.2);border:1px solid var(--gold);color:var(--gold)}
.badge-green{background:rgba(34,197,94,.2);border:1px solid var(--green);color:var(--green)}
.badge-red{background:rgba(239,68,68,.2);border:1px solid var(--red);color:var(--red)}
.badge-cyan{background:rgba(34,211,238,.2);border:1px solid var(--cyan);color:var(--cyan)}
.flashcard-text{font-size:13px;color:var(--text-mid);line-height:1.5}
.flashcard-text strong{color:var(--text);font-weight:600}
.threat-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.threat-fill{height:100%;border-radius:3px;transition:width .6s}
.threat-fill.extreme{background:linear-gradient(90deg,#ef4444,#b91c1c)}
.threat-fill.hard{background:linear-gradient(90deg,#f97316,#ea580c)}
.threat-fill.even{background:linear-gradient(90deg,#eab308,#ca8a04)}
.threat-fill.easy{background:linear-gradient(90deg,#22c55e,#16a34a)}
.threat-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;font-family:"JetBrains Mono",monospace;flex-shrink:0}
.badge-extreme{background:rgba(239,68,68,.2);color:#ef4444;border:1px solid #ef4444}
.badge-hard{background:rgba(249,115,22,.2);color:#f97316;border:1px solid #f97316}
.badge-even{background:rgba(234,179,8,.2);color:#eab308;border:1px solid #eab308}
.badge-easy{background:rgba(34,197,94,.2);color:#22c55e;border:1px solid #22c55e}
.build-order-item{display:flex;align-items:flex-start;gap:12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.build-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;border:2px solid var(--accent);color:var(--accent);background:var(--accent-dim)}
.build-item-img{width:36px;height:36px;border-radius:6px;flex-shrink:0}
.build-item-info{flex:1}
.build-item-name{font-weight:600;font-size:14px;color:var(--text)}
.build-item-reason{font-size:12px;color:var(--text-dim);margin-top:2px;line-height:1.4}
.build-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.build-tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.3);color:var(--accent);font-family:"JetBrains Mono",monospace}
.combo-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.combo-name{font-family:"Orbitron",sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--gold);margin-bottom:6px;text-transform:uppercase}
.combo-when{font-size:12px;color:var(--text-dim);margin-bottom:10px;line-height:1.4}
.combo-seq{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spell-icon{width:36px;height:36px;border-radius:8px;border:2px solid var(--border2);object-fit:cover;background:#1a1a30}
.combo-arrow{color:var(--text-dim);font-size:14px;font-weight:700}
.combo-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;font-family:"JetBrains Mono",monospace}
.cb-easy{background:rgba(34,197,94,.15);color:var(--green)}
.cb-mid{background:rgba(234,179,8,.15);color:var(--gold)}
.cb-hard{background:rgba(239,68,68,.15);color:var(--red)}
.cb-key{background:rgba(168,85,247,.2);border:1px solid var(--accent);color:var(--accent)}
.calc-input{background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;width:100%;color:var(--text);font-family:"JetBrains Mono",monospace;font-size:14px;outline:none;transition:border-color .2s}
.calc-input:focus{border-color:var(--accent)}
.calc-label{font-size:13px;color:var(--text-mid);margin-bottom:6px;display:block;font-weight:500}
.calc-result-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.calc-result-row:last-child{border-bottom:none}
.calc-dmg{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;color:var(--gold);margin-left:auto}
.calc-label-sm{font-size:13px;color:var(--text-mid)}
.slot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.draft-slot{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:all .2s;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.draft-slot:hover{border-color:var(--accent-glow)}
.draft-slot.filled{border-color:var(--accent)}
.draft-slot.mid-slot{border-color:rgba(239,68,68,.4)}
.draft-slot.mid-slot.filled{border-color:#ef4444}
.draft-slot img{width:44px;height:44px;border-radius:50%;border:2px solid var(--border2)}
.draft-slot-label{font-size:10px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.draft-slot-name{font-size:12px;font-weight:600;color:var(--text);margin-top:2px}
.pool-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center}
.pool-modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:20px;width:90%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;gap:12px}
.pool-search{background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;width:100%;color:var(--text);font-family:"Rajdhani",sans-serif;font-size:15px;outline:none}
.pool-search:focus{border-color:var(--accent)}
.pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;overflow-y:auto;max-height:400px;padding-right:4px}
.pool-grid::-webkit-scrollbar{width:4px}
.pool-grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.pool-champ{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:8px 4px;cursor:pointer;transition:all .15s;text-align:center}
.pool-champ:hover{border-color:var(--accent);background:var(--accent-dim)}
.pool-champ img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.pool-champ-name{font-size:10px;color:var(--text-mid);line-height:1.2;font-weight:500}
.matchup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.matchup-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;text-align:center;transition:all .2s}
.matchup-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.matchup-card img{width:56px;height:56px;border-radius:50%;border:3px solid var(--border2);margin-bottom:6px}
.matchup-card-name{font-size:12px;font-weight:600;margin-bottom:4px}
.sec-title{font-family:"Orbitron",sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-mid);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:8px;padding:8px 18px;cursor:pointer;font-family:"Rajdhani",sans-serif;font-weight:600;font-size:14px;color:var(--accent);transition:all .2s}
.btn:hover{background:rgba(168,85,247,.25);box-shadow:0 0 12px var(--accent-glow)}
.btn-red{background:rgba(239,68,68,.12);border-color:#ef4444;color:#ef4444}
.btn-red:hover{background:rgba(239,68,68,.25)}
.stat-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;font-family:"JetBrains Mono",monospace}
.stat-chip.ad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#ef4444}
.stat-chip.ap{background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.3);color:#a855f7}
.stat-chip.mobile{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);color:#22d3ee}
.stat-chip.tank{background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);color:#818cf8}
.stat-chip.assassin{background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.3);color:#f97316}
.stat-chip.mr{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#22c55e}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}.slot-grid{grid-template-columns:repeat(3,1fr)}.matchup-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
.rune-tree{display:flex;flex-direction:column;gap:12px}
.rune-row{display:flex;gap:10px;align-items:center;justify-content:center}
.rune-tree-title{text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:8px}
.rune-keystone .rune-icon{width:60px;height:60px}
.sit-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.sit-item:last-child{border-bottom:none}
.sit-item img{width:36px;height:36px;border-radius:6px;flex-shrink:0}
.sit-item-name{font-weight:600;font-size:14px;color:var(--text);min-width:160px}
.sit-item-when{font-size:12px;color:var(--text-dim);flex:1}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;font-family:"Rajdhani",sans-serif;background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--text-mid);transition:all .2s}
.filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.timeline{position:relative;padding-left:36px;margin-top:8px}
.timeline::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--accent),rgba(168,85,247,.1))}
.tl-item{position:relative;margin-bottom:24px}
.tl-dot{position:absolute;left:-29px;top:4px;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.tl-dot.gold{border-color:var(--gold);color:var(--gold)}.tl-dot.green{border-color:var(--green);color:var(--green)}.tl-dot.red{border-color:var(--red);color:var(--red)}
.tl-label{font-family:"Orbitron",sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.tl-label.gold{color:var(--gold)}.tl-label.green{color:var(--green)}.tl-label.red{color:var(--red)}
.tl-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
.tl-body{font-size:13px;color:var(--text-mid);line-height:1.6}
.phase-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;font-family:"JetBrains Mono",monospace;margin-bottom:10px}
.phase-badge.purple{background:rgba(168,85,247,.12);border:1px solid var(--accent);color:var(--accent)}
.phase-badge.gold{background:rgba(251,191,36,.12);border:1px solid var(--gold);color:var(--gold)}
.phase-badge.red{background:rgba(239,68,68,.12);border:1px solid var(--red);color:var(--red)}
.do-dont{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.do-card{background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:12px}
.dont-card{background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px}
.do-card .label{font-size:11px;font-weight:700;color:var(--green);margin-bottom:8px;font-family:"JetBrains Mono",monospace}
.dont-card .label{font-size:11px;font-weight:700;color:var(--red);margin-bottom:8px;font-family:"JetBrains Mono",monospace}
.do-card li,.dont-card li{font-size:12px;color:var(--text-mid);margin-left:14px;margin-bottom:4px;line-height:1.4}
.prio-chip{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;font-family:"JetBrains Mono",monospace}
.prio-1{background:rgba(239,68,68,.15);border:1px solid var(--red);color:var(--red)}
.prio-2{background:rgba(249,115,22,.15);border:1px solid var(--orange);color:var(--orange)}
.prio-3{background:rgba(251,191,36,.15);border:1px solid var(--gold);color:var(--gold)}
.prio-4{background:rgba(34,197,94,.15);border:1px solid var(--green);color:var(--green)}
.prio-arrow{color:var(--text-dim);font-size:12px}
@media(max-width:640px){.do-dont{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="champion-selector">
  <button class="champ-btn active" onclick="selectChampion('Veigar')" id="btn-Veigar">
    <img id="img-veigar" src="" alt="Veigar" onerror="this.style.display='none'" loading="lazy">
    <span>Veigar</span>
  </button>
  <button class="champ-btn" onclick="selectChampion('Syndra')" id="btn-Syndra">
    <img id="img-syndra" src="" alt="Syndra" onerror="this.style.display='none'" loading="lazy">
    <span>Syndra</span>
  </button>
</div>
<div id="tabs">
  <button class="tab-btn active" onclick="switchTab('draft')">🎯 Draft Analyzer</button>
  <button class="tab-btn" onclick="switchTab('matchups')">⚔️ Matchups</button>
  <button class="tab-btn" onclick="switchTab('build')">🔮 Build</button>
  <button class="tab-btn" onclick="switchTab('runes')">💎 Runes</button>
  <button class="tab-btn" onclick="switchTab('calc')">🧮 Calculateur</button>
  <button class="tab-btn" onclick="switchTab('combos')">🎮 Combos</button>
  <button class="tab-btn" onclick="switchTab('gameplan')">🗺️ Game Plan</button>
</div>
<div id="content">
  <div class="tab-panel active" id="panel-draft">
    <div class="slot-grid" id="draft-slots">
      <div class="draft-slot mid-slot" data-role="mid" onclick="openPool('mid')" id="slot-mid"><div class="draft-slot-label">MID 🎯</div><div class="draft-slot-name" id="slot-mid-name">Cliquer</div></div>
      <div class="draft-slot" data-role="top" onclick="openPool('top')" id="slot-top"><div class="draft-slot-label">TOP</div><div class="draft-slot-name" id="slot-top-name">Cliquer</div></div>
      <div class="draft-slot" data-role="jungle" onclick="openPool('jungle')" id="slot-jungle"><div class="draft-slot-label">JGL</div><div class="draft-slot-name" id="slot-jungle-name">Cliquer</div></div>
      <div class="draft-slot" data-role="adc" onclick="openPool('adc')" id="slot-adc"><div class="draft-slot-label">ADC</div><div class="draft-slot-name" id="slot-adc-name">Cliquer</div></div>
      <div class="draft-slot" data-role="support" onclick="openPool('support')" id="slot-support"><div class="draft-slot-label">SUP</div><div class="draft-slot-name" id="slot-support-name">Cliquer</div></div>
    </div>
    <button class="btn btn-red" onclick="resetDraft()">🔄 Reset Draft</button>
    <div class="draft-result" id="draft-result"></div>
  </div>
  <div class="tab-panel" id="panel-matchups">
    <input type="text" id="matchup-search" placeholder="Rechercher un champion..." class="pool-search" style="margin-bottom:12px" oninput="filterMatchups()">
    <div class="filter-row" id="matchup-filters">
      <button class="filter-btn active" onclick="setMatchupFilter('all',this)">Tous</button>
      <button class="filter-btn" onclick="setMatchupFilter('extreme',this)">🔴 Extrême</button>
      <button class="filter-btn" onclick="setMatchupFilter('hard',this)">🟠 Difficile</button>
      <button class="filter-btn" onclick="setMatchupFilter('even',this)">🟡 Équilibré</button>
      <button class="filter-btn" onclick="setMatchupFilter('easy',this)">🟢 Facile</button>
    </div>
    <div class="matchup-grid" id="matchup-grid"></div>
    <div id="matchup-detail" style="margin-top:20px"></div>

const CALC={
  Veigar:{
    inputs:[
      {id:'stacks',label:'Stacks passif',min:0,max:1200,def:200,step:10},
      {id:'ap_items',label:'AP items (ex: 300)',min:0,max:800,def:300,step:10},
      {id:'rabadon',label:"Rabadon's ?",type:'checkbox',def:false},
      {id:'q_rank',label:'Rang Q (1-5)',min:1,max:5,def:5,step:1},
      {id:'r_rank',label:'Rang R (1-3)',min:1,max:3,def:3,step:1}
    ],
    calc(v){
      let totalAP=v.stacks+v.ap_items;
      if(v.rabadon)totalAP*=1.35;
      const qBase=[80,120,160,200,240],qRatio=[.5,.55,.6,.65,.7];
      const rMinBase=[175,250,325],rMaxBase=[350,500,650];
      const rMinRatio=[.65,.7,.75],rMaxRatio=[1.3,1.4,1.5];
      const qr=v.q_rank-1,rr=v.r_rank-1;
      const Q=Math.round(qBase[qr]+qRatio[qr]*totalAP);
      const W=Math.round(305+1.1*totalAP);
      const E=Math.round(70+.3*totalAP);
      const Rmin=Math.round(rMinBase[rr]+rMinRatio[rr]*totalAP);
      const Rmax=Math.round(rMaxBase[rr]+rMaxRatio[rr]*totalAP);
      return{totalAP:Math.round(totalAP),Q,W,E,Rmin,Rmax,combo:Q+W+Rmax};
    }
  },
  Syndra:{
    inputs:[
      {id:'splinters',label:'Splinters (0-120)',min:0,max:120,def:80,step:5},
      {id:'ap_items',label:'AP items',min:0,max:800,def:350,step:10},
      {id:'spheres',label:'Spheres pour R (3-7)',min:3,max:7,def:5,step:1},
      {id:'q_rank',label:'Rang Q (1-5)',min:1,max:5,def:5,step:1},
      {id:'r_rank',label:'Rang R (1-3)',min:1,max:3,def:3,step:1}
    ],
    calc(v){
      let totalAP=v.ap_items;
      if(v.splinters>=120)totalAP*=1.15;
      const qBase=[80,115,150,185,220];
      const rSphereBase=[80,120,160];
      const qr=v.q_rank-1,rr=v.r_rank-1;
      const Q=Math.round(qBase[qr]+.65*totalAP);
      const W=Math.round(230+.6*totalAP);
      const E=Math.round(200+.6*totalAP);
      const R=Math.round((rSphereBase[rr]+.65*totalAP)*v.spheres);
      return{totalAP:Math.round(totalAP),Q,W,E,R,spheres:v.spheres,combo:Q+W+R};
    }
  }
};

function renderPoolGrid(search){
  const role=currentPoolRole;
  let champs=CHAMP_DB.filter(c=>{
    const nm=c.n.toLowerCase().includes(search);
    if(search)return nm;
    if(role==='mid')return c.roles.includes('mid');
    if(role==='top')return c.roles.includes('top');
    if(role==='jungle')return c.roles.includes('jungle');
    if(role==='adc')return c.roles.includes('adc');
    if(role==='support')return c.roles.includes('support');
    return true;
  }).sort((a,b)=>a.n.localeCompare(b.n));

function selectChampForSlot(name){draft[currentPoolRole]=name;updateSlot(currentPoolRole,name);closePool();renderDraftResult();saveState();}

function updateSlot(role,name){
  const slot=document.getElementById('slot-'+role);
  const nameEl=document.getElementById('slot-'+role+'-name');
  slot.classList.add('filled');
  const oldImg=slot.querySelector('img');if(oldImg)oldImg.remove();
  const img=document.createElement('img');img.src=champImg(name);img.alt=name;img.onerror=function(){this.style.display='none';};img.loading='lazy';
  slot.insertBefore(img,nameEl);nameEl.textContent=name;
}

function resetDraft(){
  draft={mid:null,top:null,jungle:null,adc:null,support:null};
  ['mid','top','jungle','adc','support'].forEach(role=>{
    const slot=document.getElementById('slot-'+role);const nameEl=document.getElementById('slot-'+role+'-name');
    slot.classList.remove('filled');const img=slot.querySelector('img');if(img)img.remove();
    nameEl.textContent='Cliquer';
  });
  document.getElementById('draft-result').innerHTML='';saveState();
}

// ─── Build engine : zero duplicates ──────────────────────────────
function buildSyndra(enemies,db,adCount,apCount,mobileCount,tankCount,mrCount,assassinCount,midData){
  const midIsAD=midData&&midData.dmg==='ad'&&midData.mobile;
  const midIsAssassinAP=midData&&midData.dmg==='ap'&&midData.mobile&&!midData.tanky;

  // ── ITEM 1 : Core 1 (Blackfire vs tanks, Luden otherwise)
  let i1,i1r;
  if(tankCount>=2){i1="Blackfire Torch";i1r=`${tankCount} tanks ennemis. Burn %HP traverse leur sante massive. Genere +AP par cible touchee.`;}
  else{i1="Luden's Companion";i1r="Compo squishy / standard. Poke + mana + burst imm. niv 6. Luden's snowball > Blackfire sur squishies.";}

  // ── ITEM 2 : Boots (jamais les memes que i1, ca ne peut pas arriver)
  let i2,i2r;
  const hasSlows=db.some(c=>['Nasus','Ashe','Cassiopeia'].includes(c.n));
  if(hasSlows){i2="Boots of Swiftness";i2r="Compo avec slows — tu as besoin de rester mobile pour placer tes stuns.";}
  else if(i1==="Blackfire Torch"){i2="Ionian Boots";i2r="Ionian Boots : ton E revient plus vite = moins vulnerable apres un mauvais E. +Summoner Haste.";}
  else{i2="Sorcerer's Shoes";i2r="Flat magic pen sur squishies. Meilleur DPS en early avec le build Luden's burst.";}

  // ── ITEM 3 : Core 2 (depend de i1)
  let i3,i3r;
  if(i1==="Blackfire Torch"){i3="Cosmic Drive";i3r="Synergy Challenger : chaque tick Blackfire reapplique le movespeed de Cosmic. Haste + HP + mouvement permanent.";}
  else{i3="Shadowflame";i3r="Flat pen maximale sur squishies. Crit sous 40% HP. Synergise avec Luden's pour one-shot sur une rotation.";}

  // ── ITEM 4 : Rabadon's (toujours different des 3 precedents)
  const i4="Rabadon's Deathcap";
  const i4r="Multiplicateur AP +35%. Non-negociable. Toujours en 4e — tu as assez de survie (Cosmic HP ou Luden mana).";

  // ── ITEM 5 : Pen (different de tous les precedents)
  let i5,i5r;
  if(mrCount>=2){i5="Void Staff";i5r=`${mrCount} ennemis qui build MR. % pen obligatoire.`;}
  else{i5="Cryptbloom";i5r="Pen magique + heal sur kill. Synergie avec execute R (100 stacks). Tu chaînes les kills.";}

  // ── ITEM 6 : Survie (different de tous les precedents)
  let i6,i6r;
  if(midIsAD){i6="Zhonya's Hourglass";i6r=`Assassin AD mid (${midData.n}). Stasis pendant leur burst — riposte pendant leurs CDs.`;}
  else if(midIsAssassinAP||apCount>=3){i6="Banshee's Veil";i6r=`${apCount>=3?apCount+" AP ennemis":"Assassin AP mid"}. Spellshield bloque l'engage initial.`;}
  else if(tankCount>=2&&mrCount<2){i6="Banshee's Veil";i6r="Protection vs engage frontal des tanks. Bloque leur CC initiale.";}
  else{i6="Zhonya's Hourglass";i6r="Defensif standard. Active pendant les burst assassins ou apres avoir lance ton E (CD long).";}

  // Garantie anti-doublon
  const used=new Set([i1,i2,i3,i4,i5]);
  if(used.has(i6)){i6=(i6==="Zhonya's Hourglass")?"Banshee's Veil":"Zhonya's Hourglass";i6r="Ajuste pour eviter doublon. Item defensif adaptatif.";}

  return [
    {n:i1,reason:i1r,tags:['Core','Rush']},
    {n:i2,reason:i2r,tags:['Mobilite']},
    {n:i3,reason:i3r,tags:['Core']},
    {n:i4,reason:i4r,tags:['AP','x1.35']},
    {n:i5,reason:i5r,tags:['Pen']},
    {n:i6,reason:i6r,tags:['Defense']}
  ];
}

function renderDraftResult(){
  const el=document.getElementById('draft-result');
  if(!draft.mid){el.innerHTML='';return;}
  const enemies=Object.values(draft).filter(Boolean);
  const db=enemies.map(n=>CHAMP_DB.find(c=>c.n===n)).filter(Boolean);
  const adCount=db.filter(c=>c.dmg==='ad').length;
  const apCount=db.filter(c=>c.dmg==='ap').length;
  const mobileCount=db.filter(c=>c.mobile).length;
  const tankCount=db.filter(c=>c.tanky).length;
  const mrCount=db.filter(c=>c.mr).length;
  const assassinCount=db.filter(c=>(c.mobile&&!c.tanky&&(c.dmg==='ad'||c.n==='LeBlanc'||c.n==='Fizz'||c.n==='Akali'||c.n==='Katarina'))).length;
  const midData=CHAMP_DB.find(c=>c.n===draft.mid)||{};

  let build,strat,runeReco;

  if(currentChamp==='Syndra'){
    build=buildSyndra(enemies,db,adCount,apCount,mobileCount,tankCount,mrCount,assassinCount,midData);
    const midIsAD=midData.dmg==='ad'&&midData.mobile&&!midData.tanky;
    const midIsAP=midData.dmg==='ap'&&midData.mobile&&!midData.tanky;
    strat=tankCount>=2?`${tankCount} tanks. Build DPS Blackfire — spam stuns, focus frontline puis backline via R+E. Synthetise les spheres AVANT le fight.`:
          mobileCount>=3?`${mobileCount} mobiles ennemis. Ton E est ta SEULE defense — ne le gaspille pas. R+E en TF = spheres au sol = stun imblocable.`:
          apCount>=3?`${apCount} AP ennemis. Banshee's en 6e obligatoire. Build Burst — flancs sur squishies hors vision.`:
          `Compo favorable. Build one-shot actif. Cherche le kill niv 6-7 a 40 stacks (2 charges Q). Joue side, cree du jeu seule.`;
    runeReco=midIsAD?'Aery + Bone Plating (Resolve 2e arbre) contre '+draft.mid+'. Vital.':
             midIsAP?'Aery + Bone Plating. Leur burst early = mortel.':
             (adCount<=1&&apCount<=1&&tankCount>=1)?'First Strike — tu pokes librement, gene de l\'or et scales.':
             mobileCount<=1&&apCount>=2?'Arcane Comet si tu ne peux pas approcher souvent.':
             'Aery standard optimal. Manaflow + Transcendence + Scorch.';
  } else {
    // Veigar build engine
    const midIsAD=midData&&midData.dmg==='ad'&&midData.mobile;
    const midIsAssassin=midData&&midData.mobile&&!midData.tanky;
    const hasSlows=db.some(c=>['Cassiopeia','Nasus'].includes(c.n));
    const boots=hasSlows?"Boots of Swiftness":"Ionian Boots";
    const useFimbul=mobileCount>=3||(midIsAssassin&&mobileCount>=2)||midIsAD;
    const tearItem=useFimbul?"Fimbulwinter":"Seraph's Embrace";
    const firstBig=tankCount>=2?"Blackfire Torch":"Rod of Ages";
    const penItem=mrCount>=2?"Void Staff":"Cryptbloom";
    let defItem;
    if(midIsAD){defItem="Zhonya's Hourglass";}
    else if(apCount>=3||(midData.dmg==='ap'&&midIsAssassin)){defItem="Banshee's Veil";}
    else{defItem="Zhonya's Hourglass";}
    // Garantie anti-doublon pour Veigar aussi
    const used6=new Set(["Tear of the Goddess",boots,firstBig,tearItem,"Rabadon's Deathcap",penItem]);
    if(used6.has(defItem)){defItem=defItem==="Zhonya's Hourglass"?"Banshee's Veil":"Zhonya's Hourglass";}
    build=[
      {n:"Tear of the Goddess",reason:"Rush Tear pour mana infinie. Prépare Seraph's/Fimbulwinter.",tags:['Mana']},
      {n:boots,reason:boots==="Boots of Swiftness"?"Slows adverses detectes — mobilite essentielle.":"Haste Q + stack passif + Summoner Haste.",tags:['Boots']},
      {n:firstBig,reason:firstBig==="Blackfire Torch"?`${tankCount} tanks. DoT %HP passe leur resistance.`:"HP + Mana + AP scaling. Fondation standard.",tags:['Core']},
      {n:tearItem,reason:tearItem==="Fimbulwinter"?`${mobileCount} mobiles. Shield sur chaque cage E.`:"Mana massive -> AP via passif. Sustain TF.",tags:['Core']},
      {n:"Rabadon's Deathcap",reason:"Multiplicateur +35% AP. Stacks passif x Rabadon = one-shot.",tags:['AP']},
      {n:penItem,reason:penItem==="Void Staff"?`${mrCount} ennemis MR. % pen obligatoire.`:"Pen magique + heal sur kill.",tags:['Pen']},
      {n:defItem,reason:defItem==="Zhonya's Hourglass"?`Survie vs ${draft.mid}. Stasis pendant leur burst.`:`Bloque le burst de ${draft.mid}. Spellshield.`,tags:['Defense']}
    ];
    strat=mobileCount>=3?`${mobileCount} mobiles. Fimbulwinter + cage preventive. Jamais seul.`:
          tankCount>=2?`${tankCount} tanks. Blackfire + Void Staff pour percer.`:
          `Compo standard. Scale tes stacks, place cage pour zone TF.`;
    runeReco=midIsAssassin&&midData.dmg==='ad'?'Bone Plating obligatoire (Resolve).':apCount>=3?'Shard MR au lieu AP.':'Aery + Biscuit standard.';
  }

  const bHtml=build.map((item,i)=>`
    <div class="build-order-item">
      <div class="build-num">${i+1}</div>
      <img class="build-item-img" src="${iImg(item.n)}" alt="${item.n}" onerror="this.style.display='none'" loading="lazy">
      <div class="build-item-info">
        <div class="build-item-name">${item.n}</div>
        <div class="build-item-reason">${item.reason}</div>
        <div class="build-tags">${item.tags.map(t=>`<span class="build-tag">${t}</span>`).join('')}</div>
      </div>
    </div>`).join('');

  const buildStr=build.map(b=>b.n).join(' -> ');
  el.innerHTML=`
    <div class="sec-title" style="margin-top:20px">ANALYSE DE COMPOSITION</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <span class="stat-chip ad">AD: ${adCount}</span>
      <span class="stat-chip ap">AP: ${apCount}</span>
      <span class="stat-chip mobile">Mobile: ${mobileCount}</span>
      <span class="stat-chip tank">Tank: ${tankCount}</span>
      <span class="stat-chip assassin">Assassins: ${assassinCount}</span>
      <span class="stat-chip mr">MR: ${mrCount}</span>
    </div>
    <div class="card mt-16"><div class="card-title">BUILD ORDER — ZERO DOUBLON GARANTI</div>${bHtml}
      <button class="btn" style="margin-top:12px" onclick="copyBuild('${buildStr}')">Copier le build</button>
    </div>
    <div class="grid-2 mt-16">
      <div class="card"><div class="card-title">STRATEGIE</div><p style="font-size:14px;color:var(--text-mid);line-height:1.6">${strat}</p></div>
      <div class="card"><div class="card-title">RUNES RECOMMANDEES</div><p style="font-size:14px;color:var(--text-mid);line-height:1.6">${runeReco}</p></div>
    </div>`;
}

  const sorted=[...filtered].sort((a,b)=>({extreme:0,hard:1,even:2,easy:3}[a.t]-{extreme:0,hard:1,even:2,easy:3}[b.t]));
  const grid=document.getElementById('matchup-grid');

    <div class="matchup-card" onclick="showMatchupDetail('${m.n.replace(/'/g,"\\'")}')">

      <div><span class="threat-badge badge-${m.t}">${m.t.toUpperCase()}</span></div>

        <div style="margin-bottom:10px"><div style="font-size:12px;color:var(--text-dim);margin-bottom:6px">BUILD ORDER</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">${b.items.map((it,idx)=>`<div class="item-chip"><div class="build-num" style="width:20px;height:20px;font-size:10px;flex-shrink:0">${idx+1}</div><img src="${iImg(it)}" alt="${it}" onerror="this.style.display='none'" loading="lazy"><span class="item-chip-name">${it}</span></div>`).join('')}</div>
        </div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:8px">Slot flexible : ${b.sixth}</div>
        <p style="font-size:13px;color:var(--text-mid);margin-top:10px;line-height:1.5">${b.desc}</p>
      </div>`).join('')}

      ${data.situational.map(s=>`<div class="sit-item"><img src="${iImg(s.n)}" alt="${s.n}" onerror="this.style.display='none'" loading="lazy"><div class="sit-item-name">${s.n}</div><div class="sit-item-when">${s.when}</div></div>`).join('')}
    </div>`;}

// ================================================================
//  RUNES TAB
// ================================================================
function renderRunes(){
  const data=RUNES[currentChamp];
  const base=DDragonImg+'/';
  function ri(r,sz=''){return `<div class="rune-icon ${r.active!==false?'active':'inactive'} ${sz}"><img src="${base+r.path}" alt="${r.name}" onerror="this.style.display='none'" loading="lazy"><div class="tooltip"><span class="tooltip-name">${r.name}</span><span class="tooltip-desc">${r.desc}</span></div></div>`;}
  const alts=[data.alt,data.alt2,data.alt3].filter(Boolean).map(a=>`
    <div class="card mt-16">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="card-title" style="margin:0">${a.name}</div><span class="build-tag">${a.tag}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div class="rune-icon active rune-keystone"><img src="${base+a.keystone.path}" alt="${a.keystone.name}" onerror="this.style.display='none'" loading="lazy"><div class="tooltip"><span class="tooltip-name">${a.keystone.name}</span><span class="tooltip-desc">${a.keystone.desc}</span></div></div>
        <p style="font-size:13px;color:var(--text-mid);line-height:1.5">${a.desc}</p>
      </div>
    </div>`).join('');
  document.getElementById('runes-content').innerHTML=`
    <div class="sec-title">RUNES — ${currentChamp.toUpperCase()}</div>
    <div class="grid-2">
      <div class="card">
        <div class="rune-tree-title"><img src="${base+data.primary.treeImg}" style="width:24px;height:24px;vertical-align:middle;margin-right:6px" onerror="this.style.display='none'" loading="lazy">${data.primary.tree} (Primaire)</div>
        <div class="rune-tree">
          <div class="rune-row rune-keystone">${ri({...data.primary.keystone,active:true},'rune-keystone')}</div>
          ${data.primary.rows.map(row=>`<div class="rune-row">${row.map(r=>ri(r)).join('')}</div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="rune-tree-title"><img src="${base+data.secondary.treeImg}" style="width:24px;height:24px;vertical-align:middle;margin-right:6px" onerror="this.style.display='none'" loading="lazy">${data.secondary.tree} (Secondaire)</div>
        <div class="rune-tree"><div class="rune-row">${data.secondary.runes.map(r=>ri(r)).join('')}</div></div>
        <div style="margin-top:20px"><div class="rune-tree-title">Shards</div>
          <div class="rune-row">${data.shards.map(s=>`<div class="rune-icon active"><img src="${base+s.img}" style="width:100%;height:100%;border-radius:50%" onerror="this.style.display='none'" loading="lazy"></div>`).join('')}</div>
          <div style="display:flex;gap:8px;margin-top:8px">${data.shards.map(s=>`<span style="font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono'">${s.label}</span>`).join('')}</div>
        </div>
      </div>
    </div>
    ${alts}
    <div class="card mt-16"><div class="card-title">ADAPTATIONS PAR MATCHUP</div>
      ${data.matchupAdapt.map(a=>`<div class="flashcard"><div class="flashcard-badge badge-cyan" style="font-size:10px;min-width:32px;text-align:center">VS</div><div class="flashcard-text"><strong>${a.vs}</strong> -> ${a.rune}<br><span style="font-size:12px;color:var(--text-dim)">${a.desc}</span></div></div>`).join('')}
    </div>`;}

// ================================================================
//  CALCULATOR
// ================================================================
function renderCalc(){
  const data=CALC[currentChamp];
  const spells=SPELLS[currentChamp];
  const inputs=data.inputs.map(inp=>{
    if(inp.type==='checkbox')return `<div style="margin-bottom:12px"><label class="calc-label" style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" id="calc_${inp.id}" ${inp.def?'checked':''} onchange="updateCalc()" style="width:18px;height:18px;accent-color:var(--accent)">${inp.label}</label></div>`;
    return `<div style="margin-bottom:12px"><label class="calc-label" for="calc_${inp.id}">${inp.label} <span id="calc_${inp.id}_val" style="color:var(--accent);font-family:'JetBrains Mono'">${inp.def}</span></label><input type="range" id="calc_${inp.id}" min="${inp.min}" max="${inp.max}" step="${inp.step}" value="${inp.def}" class="calc-input" style="height:4px;padding:0;cursor:pointer" oninput="document.getElementById('calc_${inp.id}_val').textContent=this.value;updateCalc()"></div>`;
  }).join('');
  document.getElementById('calc-content').innerHTML=`<div class="sec-title">CALCULATEUR — ${currentChamp.toUpperCase()}</div><div class="grid-2"><div class="card"><div class="card-title">PARAMETRES</div>${inputs}</div><div class="card"><div class="card-title">RESULTATS</div><div id="calc-results"></div></div></div>`;
  updateCalc();
}
function updateCalc(){
  const data=CALC[currentChamp],spells=SPELLS[currentChamp],v={};
  data.inputs.forEach(inp=>{const el=document.getElementById('calc_'+inp.id);if(!el)return;if(inp.type==='checkbox')v[inp.id]=el.checked;else v[inp.id]=Number(el.value);});
  const res=data.calc(v);
  const el=document.getElementById('calc-results');if(!el)return;
  const rows=currentChamp==='Veigar'?[
    {k:'totalAP',l:'AP Total',icon:null},{k:'Q',l:'Degats Q',icon:spells.Q},{k:'W',l:'Degats W',icon:spells.W},
    {k:'E',l:'Degats E',icon:spells.E},{k:'Rmin',l:'R minimum',icon:spells.R},{k:'Rmax',l:'R maximum',icon:spells.R},{k:'combo',l:'Combo Q+W+R',icon:null}
  ]:[
    {k:'totalAP',l:'AP Total',icon:null},{k:'Q',l:'Degats Q',icon:spells.Q},{k:'W',l:'Degats W',icon:spells.W},
    {k:'E',l:'Degats E (base)',icon:spells.E},{k:'R',l:`R (${res.spheres} spheres)`,icon:spells.R},{k:'combo',l:'Combo Q+W+R',icon:null}
  ];
  el.innerHTML=rows.map(r=>`<div class="calc-result-row">${r.icon?`<img src="${spellImg(r.icon)}" style="width:28px;height:28px;border-radius:6px;flex-shrink:0" onerror="this.style.display='none'" loading="lazy">`:'<div style="width:28px"></div>'}<span class="calc-label-sm">${r.l}</span><span class="calc-dmg">${res[r.k]?.toLocaleString('fr-FR')??'?'}</span></div>`).join('');}

// ================================================================
//  COMBOS TAB
// ================================================================
function renderCombos(){
  const combos=COMBOS_DATA[currentChamp],spells=SPELLS[currentChamp];
  const diffMap={'easy':'cb-easy','mid':'cb-mid','hard':'cb-hard'};
  const diffLabel={'easy':'DEBUTANT','mid':'STANDARD','hard':'AVANCE / CHALLENGER'};
  let html=combos.map(combo=>{
    const seqHtml=combo.seq.map((s,i)=>{
      const isFlash=s==='FLASH';
      const src=isFlash?spellImg(FLASH_SPELL):spellImg(spells[s]);
      return `${i>0?'<span class="combo-arrow">-></span>':''}<div style="text-align:center"><img class="spell-icon" src="${src}" alt="${s}" onerror="this.style.display='none'" loading="lazy"><div style="font-size:10px;color:var(--text-dim);margin-top:2px;font-family:'JetBrains Mono'">${isFlash?'Flash':s}</div></div>`;
    }).join('');
    return `<div class="combo-card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div class="combo-name" style="margin:0">${combo.name}</div><span class="combo-badge ${diffMap[combo.diff]||'cb-mid'}">${diffLabel[combo.diff]||'STANDARD'}</span></div><div class="combo-when">${combo.when}</div><div class="combo-seq">${seqHtml}</div></div>`;
  }).join('');

  if(currentChamp==='Syndra'){html+=`
    <div class="card mt-16"><div class="card-title">TIPS MECANIQUES CLE</div>
      <div class="flashcard"><div class="flashcard-badge badge-purple">E</div><div class="flashcard-text"><strong>Delai avant E sur ennemi colle :</strong> Si l'ennemi est VRAIMENT a ton corps-a-corps, attends 0.2s avant le E apres le Q — sinon tu le repousses avant que la sphere spawn et il n'est pas stun.</div></div>
      <div class="flashcard"><div class="flashcard-badge badge-gold">W</div><div class="flashcard-text"><strong>Double-tap W = teleportation :</strong> Re-taper W immediatement apres pickup = la sphere teleporte instantanement. Entraine ca — c'est "la mecanique la plus importante et non-dite de Syndra" (Challenger).</div></div>
      <div class="flashcard"><div class="flashcard-badge badge-cyan">R</div><div class="flashcard-text"><strong>Toujours remettre un Q avant R :</strong> Erreur classique low elo = ulter avec 3 spheres alors qu'on pouvait en avoir 5-6. Chaque sphere supplementaire = plus de degats.</div></div>
      <div class="flashcard"><div class="flashcard-badge badge-red">E</div><div class="flashcard-text"><strong>Fleche sur les spheres :</strong> Chaque sphere a une petite fleche qui indique la direction de poussee selon ta position. Tourne-toi pour viser la bonne direction avant le E.</div></div>
      <div class="flashcard"><div class="flashcard-badge badge-green">W</div><div class="flashcard-text"><strong>E et W traversent les murs :</strong> Si tu lances au-dela de la moitie du mur, ta portee est quasi-doublee. Excellent pour stuner depuis un bush lateral ou chasser dans la jungle.</div></div>
    </div>`;}
  document.getElementById('combos-content').innerHTML=`<div class="sec-title">COMBOS — ${currentChamp.toUpperCase()}</div>`+html;}

init();
</script>
